<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>长江文化系统 · canonical_v2</title>
<style>
:root{--ink:#1f2937;--paper:#f8f6f1;--line:#e3ddd0;--accent:#8c3b2e;--muted:#7a7466;--ok:#2e6b4f;--warn:#9a6b1f}
*{box-sizing:border-box;margin:0}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--paper);color:var(--ink);padding:24px;max-width:1180px;margin:0 auto}
h1{font-size:22px;letter-spacing:2px}
h1 small{font-size:12px;color:var(--muted);font-weight:normal;margin-left:8px}
p.lead{margin:8px 0 18px;color:var(--muted);font-size:13px;max-width:820px;line-height:1.7}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:16px;cursor:pointer;font-size:13px}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
section{display:none}section.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card h3{font-size:14px;margin-bottom:6px}
.card .meta{font-size:12px;color:var(--muted);line-height:1.6}
.tag{display:inline-block;background:#f0ece2;border-radius:10px;padding:1px 8px;font-size:11px;margin:2px 2px 0 0}
.st-ADMITTED{color:var(--ok);font-weight:600}.st-SUPPORTED{color:var(--warn)}.st-CANDIDATE{color:var(--muted)}
.row{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.row .head{display:flex;justify-content:space-between;align-items:baseline}
.row .name{font-weight:600;font-size:14px}
.row .body{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7;white-space:pre-wrap}
.bar{height:6px;background:#eee5d6;border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.stat{font-size:26px;font-weight:700}.stat small{font-size:12px;color:var(--muted);font-weight:normal}
.kv{display:flex;gap:22px;margin:10px 0 18px;flex-wrap:wrap}
.tree{padding-left:16px;border-left:2px solid var(--line);margin:6px 0 0 6px}
.sysnode{margin:8px 0}
.sysnode>.nm{cursor:pointer;font-weight:600}
.sysnode>.nm:hover{color:var(--accent)}
</style>
</head>
<body>
<h1>长江文化系统<small>canonical_v2 · 知识基础设施</small></h1>
<p class="lead">长江文化是以长江干流、支流、湖泊及流域空间为自然底座，以七大区域文化系统和历史阶段为基本结构，
以文化传统、文化过程和文化流动为核心知识组织单元的多层异质时空知识体系。点击下方入口逐层深入：每个论断都可下钻到证据。</p>
<nav id="nav">
  <button data-t="sys" class="on">文化系统</button>
  <button data-t="hydro">流域空间</button>
  <button data-t="time">历史演进</button>
  <button data-t="trad">文化传统</button>
  <button data-t="proc">文化过程</button>
  <button data-t="flow">文化流动</button>
  <button data-t="gap">结构缺口</button>
</nav>

<section id="s-sys" class="on">
  <div class="kv" id="sys-stats"></div>
  <div id="sys-tree"></div>
</section>
<section id="s-hydro"><div class="kv" id="hydro-stats"></div><div class="grid" id="hydro-grid"></div></section>
<section id="s-time"><div id="timeline"></div></section>
<section id="s-trad"><div id="trad-list"></div></section>
<section id="s-proc"><div id="proc-list"></div></section>
<section id="s-flow"><div id="flow-list"></div></section>
<section id="s-gap"><div class="kv" id="gap-stats"></div><div id="gap-list"></div></section>

<script>
const $=q=>document.querySelector(q);
async function api(p){const r=await fetch('/yangtze/v2/'+p);if(!r.ok)throw new Error(p);return r.json()}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('nav').addEventListener('click',async e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===e.target));
  document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));
  $('#s-'+e.target.dataset.t).classList.add('on');
  await loaders[e.target.dataset.t]();
});

const loaders={};
let cache={};

loaders.sys=async()=>{
  const d=cache.sys||(cache.sys=await api('system'));
  const t=d.totals||{};
  $('#sys-stats').innerHTML=
    `<div><div class="stat">${t.regional_systems??'-'}</div><small>区域文化系统</small></div>`+
    `<div><div class="stat">${t.regions??'-'}</div><small>文化区域</small></div>`+
    `<div><div class="stat">${t.memberships??'-'}</div><small>系统成员关系</small></div>`+
    `<div><div class="stat">${t.traditions??'-'}</div><small>文化传统</small></div>`+
    `<div><div class="stat">${t.processes??'-'}</div><small>文化过程</small></div>`;
  const tree=d.tree||[];
  const render=(nodes)=>`<div class="tree">`+nodes.map(n=>`
    <div class="sysnode"><span class="nm" onclick="this.parentElement.querySelector('.tree')?.classList.toggle('tree')">${esc(n.system_name)}</span>
      <span class="tag">${esc(n.system_level)}</span>
      <span class="meta" style="font-size:11px;color:var(--muted)">成员 ${n.membership_count??0} · 传统 ${n.tradition_count??0} · 过程 ${n.process_count??0}</span>
      ${n.description?`<div class="meta">${esc(n.description)}</div>`:''}
      ${n.children&&n.children.length?render(n.children):''}
    </div>`).join('')+`</div>`;
  $('#sys-tree').innerHTML=render(tree);
};

loaders.hydro=async()=>{
  const d=cache.hydro||(cache.hydro=await api('hydro?page_size=200'));
  const items=d.items||[];
  const byType={};
  items.forEach(u=>{(byType[u.hsu_type]=byType[u.hsu_type]||[]).push(u)});
  $('#hydro-stats').innerHTML=Object.entries(byType).map(([t,us])=>
    `<div><div class="stat">${us.length}</div><small>${t}</small></div>`).join('');
  $('#hydro-grid').innerHTML=items.map(u=>`
    <div class="card"><h3>${esc(u.hsu_name)} <span class="tag">${esc(u.hsu_type)}</span></h3>
      <div class="meta">${esc(u.description||'')}</div>
      <div class="meta" style="margin-top:4px">关系数 ${u.relation_count??0}${u.parent_hsu_name?' · 上级 '+esc(u.parent_hsu_name):''}</div>
    </div>`).join('');
};

loaders.time=async()=>{
  const d=cache.time||(cache.time=await api('timeline'));
  $('#timeline').innerHTML=(d.items||[]).map(p=>`
    <div class="row"><div class="head"><span class="name">${esc(p.phase_name)}</span>
      <span>${(p.patterns||[]).map(x=>`<span class="tag">${esc(x.pattern_name||x.pattern_code)}</span>`).join('')}</span></div>
      <div class="body">过程 ${p.process_count??0} · 传统 ${p.tradition_count??0}</div>
    </div>`).join('');
};

loaders.trad=async()=>{
  const d=cache.trad||(cache.trad=await api('traditions?page_size=100'));
  $('#trad-list').innerHTML=(d.items||[]).map(t=>`
    <div class="row"><div class="head"><span class="name">${esc(t.tradition_name)}</span>
      <span class="st-${esc(t.status)}">${esc(t.status)}</span></div>
      <div class="body">${esc(t.description||t.origin||'')}</div>
    </div>`).join('')||'<p class="lead">暂无（证据不足的候选在缺口页可见）</p>';
};

loaders.proc=async()=>{
  const d=cache.proc||(cache.proc=await api('processes?page_size=100'));
  $('#proc-list').innerHTML=(d.items||[]).map(p=>`
    <div class="row"><div class="head"><span class="name">${esc(p.process_name)}</span>
      <span class="st-${esc(p.status)}">${esc(p.status)}</span></div>
      <div class="body">${esc(p.description||'')}\n时间：${esc(p.start_time||'?')} ~ ${esc(p.end_time||'?')}${p.origin_region?' · 起点：'+esc(p.origin_region):''}${p.destination_region?' · 终点：'+esc(p.destination_region):''} · 阶段 ${p.stage_count??0}</div>
    </div>`).join('')||'<p class="lead">暂无</p>';
};

loaders.flow=async()=>{
  const d=cache.flow||(cache.flow=await api('flows?page_size=100'));
  $('#flow-list').innerHTML=(d.items||[]).map(f=>`
    <div class="row"><div class="head"><span class="name">${esc(f.flow_type)}</span>
      <span>${esc(f.origin||'?')} → ${esc(f.destination||'?')}</span></div>
      <div class="body">${esc(f.content||'')}${f.via?' · 路线：'+esc(f.via):''}</div>
    </div>`).join('')||'<p class="lead">暂无 ADMITTED 流动——跨区流动证据是当前采集重点（见结构缺口）</p>';
};

loaders.gap=async()=>{
  const d=cache.gap||(cache.gap=await api('gaps?page_size=30'));
  const byType={};
  (d.items||[]).forEach(g=>{byType[g.gap_type]=(byType[g.gap_type]||0)+1});
  $('#gap-stats').innerHTML=`<div><div class="stat">${d.total??(d.items||[]).length}</div><small>OPEN 缺口（前30展示）</small></div>`+
    Object.entries(byType).map(([t,c])=>`<div><div class="stat">${c}</div><small>${t}</small></div>`).join('');
  $('#gap-list').innerHTML=(d.items||[]).map(g=>`
    <div class="row"><div class="head"><span class="name">${esc(g.gap_type)}</span>
      <span class="tag">优先级 ${(g.priority??0).toFixed?.(2)??g.priority}</span></div>
      <div class="body">${esc(JSON.stringify(g.missing_structure||{},null,0).slice(0,200))}</div>
    </div>`).join('');
};

loaders.sys();
</script>
</body>
</html>
