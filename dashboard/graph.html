<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>YCKI 文化图谱 — canonical_v2</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  body{margin:0;font-family:"Microsoft YaHei",system-ui;background:#0d1117;color:#e6edf3}
  header{padding:12px 20px;background:#161b22;border-bottom:1px solid #30363d;display:flex;gap:16px;align-items:center}
  header h1{font-size:16px;margin:0}
  .tab{padding:6px 14px;border:1px solid #30363d;border-radius:6px;cursor:pointer;user-select:none}
  .tab.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
  #net{height:calc(100vh - 96px)}
  #info{position:fixed;right:12px;top:64px;width:340px;max-height:70vh;overflow:auto;background:#161b22ee;
        border:1px solid #30363d;border-radius:8px;padding:10px 14px;font-size:12px;display:none}
  .empty{padding:30px;color:#8b949e}
</style>
</head>
<body>
<header>
  <h1>YCKI 文化图谱</h1>
  <div class="tab active" data-v="system">系统结构</div>
  <div class="tab" data-v="region">区域互动</div>
  <div class="tab" data-v="flow">文化流动</div>
  <span id="stat" style="margin-left:auto;color:#8b949e;font-size:12px"></span>
</header>
<div id="net"><div class="empty">加载中…（若持续为空请确认 dashboard 服务与 /yangtze/v2/graph/* 可达）</div></div>
<div id="info"></div>
<script>
const GROUP_STYLE = {
  root:{color:"#f0883e",font:{size:22}}, system:{color:"#1f6feb",font:{size:16}},
  domain:{color:"#3fb950",font:{size:11}}, phase:{color:"#a371f7",font:{size:12},shape:"dot"},
  hydro:{color:"#39c5cf",shape:"diamond"}, place:{color:"#e3b341"}, evidence:{color:"#8b949e"}
};
let network=null;
async function load(view){
  const r = await fetch(`/yangtze/v2/graph/${view}`);
  if(!r.ok){ document.getElementById("net").innerHTML = `<div class="empty">API ${r.status}</div>`; return; }
  const data = await r.json();
  const nodes = new vis.DataSet(data.nodes.map(n=>({id:n.id,label:n.label,
      color:GROUP_STYLE[n.group]?.color||"#8b949e", font:GROUP_STYLE[n.group]?.font||{size:12},
      shape:GROUP_STYLE[n.group]?.shape||"ellipse"})));
  const edges = new vis.DataSet(data.edges.map(e=>({from:e.from,to:e.to,label:e.label||"",
      title:e.title||null,arrows:"to",color:{color:"#555"},font:{size:10,color:"#8b949e"}})));
  const container=document.getElementById("net");
  network=new vis.Network(container,{nodes,edges},{
    physics:{solver:"barnesHut",stabilization:true},
    interaction:{hover:true,navigationButtons:true},
    nodes:{borderWidth:0}
  });
  document.getElementById("stat").textContent = `${data.nodes.length} 节点 · ${data.edges.length} 边`;
  network.on("doubleClick", async (params)=>{
    if(params.nodes.length!==1) return;
    const nid=params.nodes[0];
    if(!nid.startsWith("sys:")) return;
    await drillSystem(nid.slice(4));
  });
}
async function drillSystem(systemId){
  const info=document.getElementById("info");
  info.style.display="block";
  info.innerHTML="加载结构对象…";
  const r=await fetch(`/yangtze/v2/structure`);
  const d=await r.json();
  let html="<b>系统结构概览</b><br><br>";
  (d.systems||d.regions||[]).slice(0,20).forEach(s=>{
    html+=`• ${s.system_name||s.name||""} ${s.description?`<span style="color:#8b949e">${String(s.description).slice(0,60)}</span>`:""}<br>`;
  });
  info.innerHTML=html||"暂无";
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById("info").style.display="none";
  load(t.dataset.v);
}));
load("system");
</script>
</body>
</html>
